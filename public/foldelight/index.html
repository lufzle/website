<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#030405">
    <meta name="description" content="The MacBook has been folding since 1991. foldelight finally gives the lid the folding-glass effect. Free, open source, macOS.">
    <title>foldelight: the folding effect the MacBook was owed</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23191b1f'/%3E%3Cpath d='M12 16l20 7v26l-20-8z' fill='%237ac0c5'/%3E%3Cpath d='M32 23l21-11-2 27-19 10z' fill='%23c783a5'/%3E%3Cpath d='M32 49l19-10 9 7-20 11z' fill='%23c9aa6d'/%3E%3C/svg%3E">
    <link rel="preload" href="./assets/lock-screen.png" as="image">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="masthead" aria-label="foldelight">
      <a class="brand" href="#top" aria-label="foldelight home">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M7 14 32 23v32L7 45Z" fill="var(--cyan)"/>
          <path d="m32 23 26-14-3 34-23 12Z" fill="var(--magenta)"/>
          <path d="m32 55 23-12 8 7-25 13Z" fill="var(--gold)"/>
        </svg>
        <span>foldelight</span>
      </a>
      <nav class="masthead-actions" aria-label="Project links">
        <span class="license">AGPL-3.0</span>
        <a class="github-link" href="https://github.com/lufzle/foldelight" aria-label="foldelight on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.6 11.6 0 0 0-3.7 22.6c.6.1.8-.2.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.6-1.4-5.6-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C15.8 5 16.8 5.3 16.8 5.3c.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.9 5.4-5.6 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.6 11.6 0 0 0 12 .7Z"/>
          </svg>
        </a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Folds since 1991. Effect shipped today.</h1>
          <p class="hero-subline">foldelight adds the folding-glass effect seen on the iPhone Duo to your MacBook lid.</p>
        </div>
        <a class="scroll-cue" href="#the-fold">
          <span>Open the lid</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>
        </a>
      </section>

      <section class="fold-scroll" id="the-fold" aria-label="Scroll-controlled MacBook fold">
        <div class="fold-stage">
          <canvas id="fold-canvas" aria-label="A MacBook lock screen opening as the page scrolls"></canvas>
          <img class="fallback-poster" src="./assets/lock-screen.png" alt="Blue foldelight lock screen">
          <p class="gpu-status" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="closing" id="download" aria-labelledby="closing-title">
        <div class="closing-inner">
          <h2 id="closing-title">Adds no features. Settles one debt.</h2>
          <a class="download" href="https://github.com/lufzle/foldelight">
            <span>Check out the repo</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m0 0-5-5m5 5-5 5"/></svg>
          </a>
        </div>
        <footer>
          <p>Built with GPT-6 Astra. <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0.</a> Fold responsibly.</p>
          <nav aria-label="Legal">
            <a href="./terms/">Terms</a>
            <a href="./privacy/">Privacy</a>
          </nav>
        </footer>
      </section>
    </main>
  </body>
</html>
